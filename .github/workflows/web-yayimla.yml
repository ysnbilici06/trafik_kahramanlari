name: Web sürümünü yayımla

# Uygulamayı GitHub Pages'e koyar. Derleme adımı yok; dosyalar olduğu gibi yayımlanır.
# Adres: https://ysnbilici06.github.io/trafik_kahramanlari/
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-yayimla
  cancel-in-progress: true

jobs:
  hazirla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Yayımlanacak dosyaları ayır
        run: |
          mkdir _site
          cp index.html amblem.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Ayrı iş: aynı işte yükleme biter bitmez yayımlanınca paket henüz bulunamıyordu.
  yayimla:
    needs: hazirla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v4
